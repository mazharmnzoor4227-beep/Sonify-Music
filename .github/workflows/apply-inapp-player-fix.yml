name: Apply In App Player Fix

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch in-app player and performance
        run: python3 tools/fix_inapp_player_and_lag.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/apply-inapp-player-fix.yml tools/fix_inapp_player_and_lag.py
          git add app/src/main/java/com/sonify/music/SonifyActivityV3.kt
          git commit -m "Fix in-app official playback and reduce UI lag"
          git push
