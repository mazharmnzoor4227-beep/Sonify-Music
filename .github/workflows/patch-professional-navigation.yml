name: Patch Navigation

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Sonify navigation patch
        run: python3 .github/patch_nav.py
      - name: Commit Sonify navigation patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/sonify/music/SonifyActivityV3.kt
          git rm -f .github/patch_nav.py
          git rm -f .github/workflows/patch-professional-navigation.yml
          git rm -f .github/workflows/fix-smooth-player.yml || true
          git commit -m "Fix Android back navigation and polish Sonify UI"
          git push
