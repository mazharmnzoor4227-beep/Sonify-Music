name: Apply Spotify Premium UI

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply premium UI redesign
        run: python3 tools/spotify_premium_ui_patch.py
      - name: Commit redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/apply-spotify-premium-ui.yml
          git add app/src/main/java/com/sonify/music/SonifyActivityV3.kt
          git commit -m "Redesign Sonify with Spotify-inspired working premium UI"
          git push
