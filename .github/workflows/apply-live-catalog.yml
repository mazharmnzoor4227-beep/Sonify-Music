name: Apply Live Catalog

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch app
        run: python3 tools/patch_live_catalog.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/apply-live-catalog.yml tools/patch_live_catalog.py
          git add app/src/main/java/com/sonify/music/SonifyActivityV3.kt app/src/main/java/com/sonify/music/data/AudiusCatalog.kt app/src/main/java/com/sonify/music/data/CatalogRegistry.kt
          git commit -m "Integrate live Audius catalog across Sonify"
          git push
