name: Apply Runtime Stability

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply crash and loading fixes
        run: python3 tools/fix_runtime_stability.py
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/apply-runtime-stability.yml
          git add app/src/main/java/com/sonify/music/SonifyActivityV3.kt
          git commit -m "Fix Sonify startup crash and runtime loading glitches"
          git push
