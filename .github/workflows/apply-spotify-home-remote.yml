name: Apply Spotify Home Remote

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply UI refinement
        run: python3 tools/refine_spotify_home_remote_feed.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/apply-spotify-home-remote.yml
          git add app/src/main/java/com/sonify/music/SonifyActivityV3.kt
          git commit -m "Refine Sonify home with live editorial music feed"
          git push
