name: Apply Official YouTube UI

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply official YouTube UI patch
        run: python3 tools/official_youtube_ui_patch.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/apply-official-youtube-ui.yml
          git add app/src/main/java/com/sonify/music/SonifyActivityV3.kt
          git commit -m "Switch Sonify to official YouTube catalog UI"
          git push
