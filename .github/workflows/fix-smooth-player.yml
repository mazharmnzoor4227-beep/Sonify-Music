name: Fix smooth morph player

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch smooth player gesture and transition
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/com/sonify/music/SonifyActivityV3.kt')
          s = p.read_text()

          start = s.index('@Composable\nprivate fun V3MorphingPlayer(')
          end = s.index('@Composable\nprivate fun V3ExpandedPlayerContent(', start)

          new = r'''@Composable
private fun V3MorphingPlayer(
    track: Track,
    expanded: Boolean,
    isPlaying: Boolean,
    progress: Float,
    positionMs: Long,
    durationMs: Long,
    liked: Boolean,
    shuffle: Boolean,
    repeatMode: Int,
    onExpandedChange: (Boolean) -> Unit,
    onPrevious: () -> Unit,
    onToggle: () -> Unit,
    onNext: () -> Unit,
    onDismiss: () -> Unit,
    onSeek: (Long) -> Unit,
    onToggleLike: () -> Unit,
    onAddToPlaylist: () -> Unit,
    onQueue: () -> Unit,
    onToggleShuffle: () -> Unit,
    onToggleRepeat: () -> Unit
) {
    BoxWithConstraints(Modifier.fillMaxSize().zIndex(10f)) {
        val density = LocalDensity.current
        val fullHeight = maxHeight
        val collapsedHeight = 70.dp
        val navReserve = 80.dp
        val travelPx = with(density) {
            max((fullHeight - collapsedHeight - navReserve).toPx(), 1f)
        }

        var dragging by remember(track.id) { mutableStateOf(false) }
        var dragFraction by remember(track.id) {
            mutableFloatStateOf(if (expanded) 0f else 1f)
        }
        var settleFraction by remember(track.id) {
            mutableFloatStateOf(if (expanded) 0f else 1f)
        }

        LaunchedEffect(expanded) {
            if (!dragging) settleFraction = if (expanded) 0f else 1f
        }

        val animatedFraction by animateFloatAsState(
            targetValue = settleFraction,
            animationSpec = spring(
                dampingRatio = Spring.DampingRatioNoBouncy,
                stiffness = Spring.StiffnessMedium
            ),
            label = "player-morph"
        )

        val fraction = if (dragging) dragFraction else animatedFraction
        val playerHeight = (
            fullHeight.value + (collapsedHeight.value - fullHeight.value) * fraction
        ).dp
        val bottomSpace = (navReserve.value * fraction).dp
        val sidePad = (7f * fraction).dp
        val radius = (16f * fraction).dp

        // Expanded UI disappears before the compact controls fade in. This avoids
        // the duplicate-player look while the same container is physically shrinking.
        val expandedAlpha = ((0.72f - fraction) / 0.72f).coerceIn(0f, 1f)
        val miniAlpha = ((fraction - 0.72f) / 0.28f).coerceIn(0f, 1f)

        Surface(
            color = V3Bg,
            shape = RoundedCornerShape(radius),
            modifier = Modifier
                .align(Alignment.BottomCenter)
                .padding(start = sidePad, end = sidePad, bottom = bottomSpace)
                .fillMaxWidth()
                .height(playerHeight)
                .clip(RoundedCornerShape(radius))
                .pointerInput(track.id, travelPx) {
                    detectVerticalDragGestures(
                        onDragStart = {
                            dragging = true
                            dragFraction = fraction
                            settleFraction = fraction
                        },
                        onVerticalDrag = { change, amount ->
                            change.consume()
                            dragFraction = (
                                dragFraction + amount / travelPx
                            ).coerceIn(0f, 1f)
                        },
                        onDragCancel = {
                            val target = if (dragFraction < 0.5f) 0f else 1f
                            settleFraction = target
                            dragging = false
                            onExpandedChange(target == 0f)
                        },
                        onDragEnd = {
                            val target = if (dragFraction < 0.5f) 0f else 1f
                            // Set the animation target BEFORE leaving drag mode. This
                            // prevents the one-frame snap/jump seen in the recording.
                            settleFraction = target
                            dragging = false
                            onExpandedChange(target == 0f)
                        }
                    )
                }
        ) {
            Box(Modifier.fillMaxSize()) {
                if (expandedAlpha > 0.001f) {
                    V3ExpandedPlayerContent(
                        track = track,
                        alpha = expandedAlpha,
                        isPlaying = isPlaying,
                        positionMs = positionMs,
                        durationMs = durationMs,
                        liked = liked,
                        shuffle = shuffle,
                        repeatMode = repeatMode,
                        onCollapse = {
                            settleFraction = 1f
                            onExpandedChange(false)
                        },
                        onPrevious = onPrevious,
                        onToggle = onToggle,
                        onNext = onNext,
                        onSeek = onSeek,
                        onToggleLike = onToggleLike,
                        onAddToPlaylist = onAddToPlaylist,
                        onQueue = onQueue,
                        onToggleShuffle = onToggleShuffle,
                        onToggleRepeat = onToggleRepeat
                    )
                }

                if (miniAlpha > 0.001f) {
                    V3MiniPlayerContent(
                        track = track,
                        alpha = miniAlpha,
                        isPlaying = isPlaying,
                        progress = progress,
                        onOpen = {
                            settleFraction = 0f
                            onExpandedChange(true)
                        },
                        onPrevious = onPrevious,
                        onToggle = onToggle,
                        onNext = onNext,
                        onDismiss = onDismiss
                    )
                }
            }
        }
    }
}

'''
          s = s[:start] + new + s[end:]

          # Keep compact content pinned to a real 70dp mini-player instead of
          # stretching it through the intermediate sheet height.
          old = '''    Column(\n        Modifier\n            .fillMaxSize()\n            .graphicsLayer { this.alpha = alpha }\n    ) {\n        Row('''
          newmini = '''    Box(\n        Modifier\n            .fillMaxSize()\n            .graphicsLayer { this.alpha = alpha },\n        contentAlignment = Alignment.BottomCenter\n    ) {\n        Column(\n            Modifier\n                .fillMaxWidth()\n                .height(70.dp)\n                .clip(RoundedCornerShape(16.dp))\n                .background(Color(0xFF181818))\n        ) {\n        Row('''
          if old not in s:
              raise SystemExit('mini-player start pattern not found')
          s = s.replace(old, newmini, 1)

          marker = '''        LinearProgressIndicator(\n            progress = { progress },\n            modifier = Modifier.fillMaxWidth().height(2.dp),\n            color = V3Accent,\n            trackColor = Color(0xFF2A2A2A)\n        )\n    }\n}\n\n@Composable\nprivate fun V3HomeScreen'''
          repl = '''        LinearProgressIndicator(\n            progress = { progress },\n            modifier = Modifier.fillMaxWidth().height(2.dp),\n            color = V3Accent,\n            trackColor = Color(0xFF2A2A2A)\n        )\n        }\n    }\n}\n\n@Composable\nprivate fun V3HomeScreen'''
          if marker not in s:
              raise SystemExit('mini-player end pattern not found')
          s = s.replace(marker, repl, 1)

          p.write_text(s)
          PY
      - name: Commit smooth player fix
        run: |
          if git diff --quiet; then
            echo "Already fixed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/sonify/music/SonifyActivityV3.kt
          git commit -m "Fix smooth swipe morphing player from video"
          git push
