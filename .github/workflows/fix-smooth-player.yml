name: Fix smooth morph player

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply smooth player patch
        run: python3 tools/fix_smooth_player.py
      - name: Commit fix if needed
        run: |
          if git diff --quiet; then
            echo "Already fixed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/sonify/music/SonifyActivityV3.kt
          git commit -m "Fix smooth swipe morphing player from video"
          git push
