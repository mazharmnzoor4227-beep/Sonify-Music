name: Apply Home Artists Offline

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply Sonify UI and offline patch
        run: python3 tools/upgrade_home_artists_offline.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/apply-home-artists-offline.yml
          git add app/src/main/java/com/sonify/music/SonifyActivityV3.kt
          git commit -m "Upgrade Sonify home artists search and offline music"
          git push
