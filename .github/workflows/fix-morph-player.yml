name: Fix morph player compile

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch padding overload
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/sonify/music/SonifyActivityV3.kt')
          s = p.read_text()
          old = '.padding(horizontal = sidePad, bottom = bottomSpace)'
          new = '.padding(start = sidePad, end = sidePad, bottom = bottomSpace)'
          if old in s:
              p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix if needed
        run: |
          if git diff --quiet; then
            echo "Already fixed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/sonify/music/SonifyActivityV3.kt
          git commit -m "Fix morphing player padding compile error"
          git push
